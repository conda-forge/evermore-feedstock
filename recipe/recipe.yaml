schema_version: 1

context:
  python_min: '3.11'
  name: evermore
  version: 0.4.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/evermore-${{ version }}.tar.gz
  sha256: ac8bda871a92e4f6291c30e498de3e75d8f7caeac11904c2889bf8b81c3d4e2f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - jax >=0.10.2
    - jaxlib >=0.10.2
    - jaxtyping >=0.3.11
    - flax >=0.12.10
tests:
  - python:
      imports:
        - evermore
      pip_check: true
      python_version: ${{ python_min }}.*
  - files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - pytest
    script:
      - pytest

about:
  summary: Differentiable (binned) likelihoods in JAX.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pfackeldey/evermore
  repository: https://github.com/pfackeldey/evermore
  documentation: https://evermore.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pfackeldey
